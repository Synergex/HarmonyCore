name: 10.0.$(Rev:r)

resources:
  repositories:
  - repository: HarmonyCoreSamples
    type: github
    endpoint: Synergex
    name: Synergex/HarmonyCoreSamples
  - repository: HarmonyCoreProjectTemplates
    type: github
    endpoint: Synergex
    ref: ty/linux-env-file
    name: Synergex/HarmonyCoreProjectTemplates

parameters:
  - name: PublishProjects
    type: object
    default:
      - HarmonyCore.Test
      - Services.Test.CS
      - Services.Test
      - Services.Host

stages:
- stage: build

  displayName: 'Main Build'
  jobs: 
  # Build both Windows and "Linux" targets ON WINDOWS AGENTS (cross-RID publish).
  # This avoids msbuild capability issues and preserves your original behavior.
  - job: BuildJob
    workspace:
      clean: all
    pool:
      name: $(BuildPool)
      demands:
        - agent.name -equals $(WinAgentName)  # Windows build machine (Podman host for the Linux agent container)
    strategy:
      maxParallel: 4
      matrix:
#        Debug_x64:
#          Configuration: Debug
#          Platform: x64
        Release_x64:
          Configuration: Release
          Platform: x64
          RID: win-x64
#        Debug_x86:
#          Configuration: Debug
#          Platform: x86
#        Release_x86:
#          Configuration: Release
#          Platform: x86
        Release_linux:
          Configuration: Release
          Platform: linux64
          RID: linux-x64
    steps:
    - checkout: self
      submodules: true
      fetchDepth: 1
      fetchTags: false
    - task: ArchiveFiles@2
      condition: and(eq(variables['Platform'], 'x64'), eq(variables['Configuration'], 'Release'))
      displayName: "Archive sources"
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/net10-release.zip'
        replaceExistingArchive: true
    - task: PublishPipelineArtifact@1
      condition: and(eq(variables['Platform'], 'x64'), eq(variables['Configuration'], 'Release'))
      displayName: "Publish HCarchive"
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)' 
        artifactName: 'HCarchive'
    - task: DeleteFiles@1
      displayName: 'Clean ArtifactStagingDirectory'
      inputs:
        SourceFolder: '$(Build.ArtifactStagingDirectory)'
        Contents: '**/*'
    - task: UseDotNet@2
      displayName: 'Get .NET SDK 10.0.x'
      inputs:
        packageType: 'sdk'
        version: '10.0.x'
    - task: NuGetToolInstaller@1
      displayName: 'Get NuGet 7.x'
      inputs:
        versionSpec: 7.x
        checkLatest: true
    #- task: NuGetCommand@2
    #  displayName: 'NuGet restore'
    #  inputs:
    #    command: 'restore'
    #    restoreSolution: '**/*.sln'
        #feedsToUse: 'select'
        #vstsFeed: '632eef26-b5e5-49d5-83f0-091dbb16477c'
    - task: MSBuild@1
      displayName: 'restore solution'
      inputs:
        solution: '$(HarmonyCoreSln)'
        msbuildArchitecture: 'x64'
        platform: $(Platform)
        configuration: $(Configuration)
        msbuildArguments: '-t:restore'
        logFileVerbosity: diagnostic
        clean: false
    - task: MSBuild@1
      displayName: 'Build solution'
      inputs:
        solution: '$(HarmonyCoreSln)'
        msbuildArchitecture: 'x64'
        platform: $(Platform)
        configuration: $(Configuration)
        logFileVerbosity: diagnostic
        clean: false

    # The sample jobs must test THIS run's packages. The repo copy of cli-tool-versions.json
    # carries the released lane versions (e.g. 10.0.1) for customers, and upgrade-latest
    # stamps those as minimum-version references — which NuGet resolves to the LOWEST
    # satisfying candidate it can find (the agent's global package cache, or nuget.org once
    # 10.x is published there), not necessarily the packages this run just packed. Stamp the
    # net10 lane's Harmony.* entries with this run's build number (the byBuildNumber pack
    # version) so the samples restore exactly this run's artifacts. Only the published
    # artifact is affected; the checked-in file is not touched.
    - task: PowerShell@2
      condition: and(eq(variables['Platform'], 'x64'), eq(variables['Configuration'], 'Release'))
      displayName: 'Stamp build number into cli-tool-versions artifact'
      inputs:
        targetType: 'inline'
        script: |
          $path = "$(Build.SourcesDirectory)\cli-tool-versions.json"
          $doc = Get-Content -Path $path -Raw | ConvertFrom-Json
          $lane = $doc.KnownVersions | Where-Object { $_.TargetFramework -eq 'net10.0' } | Select-Object -First 1
          if (-not $lane) { Write-Error "No net10.0 lane found in cli-tool-versions.json"; exit 1 }
          foreach ($id in @('Harmony.Core', 'Harmony.Core.EF', 'Harmony.Core.OData', 'Harmony.Core.AspNetCore')) {
            $lane.NugetVersions.$id = "$(Build.BuildNumber)"
          }
          $doc | ConvertTo-Json -Depth 10 | Out-File -FilePath $path -Encoding utf8
          Write-Host "Stamped net10.0 lane Harmony.* versions to $(Build.BuildNumber)"

    # publish cli-tool-versions
    - task: PublishPipelineArtifact@1
      condition: and(eq(variables['Platform'], 'x64'), eq(variables['Configuration'], 'Release'))
      displayName: 'Publish cli-tool-versions'
      inputs:
        targetPath: '$(Build.SourcesDirectory)\cli-tool-versions.json'
        artifactName: 'cli-tool-versions'

    # publish cli tool
    - task: DotNetCoreCLI@2
      condition: and(eq(variables['Platform'], 'x64'), eq(variables['Configuration'], 'Release'))
      displayName: 'Publish HarmonyCore.CliTool'
      inputs:
        command: publish
        publishWebProjects: false
        arguments: '-r=$(RID) -c $(Configuration) -o $(Build.ArtifactStagingDirectory)'
        verbosityPack: Diagnostic
        zipAfterPublish: True
        projects: |
          HarmonyCore.CliTool

    - task: PublishPipelineArtifact@1
      condition: and(eq(variables['Platform'], 'x64'), eq(variables['Configuration'], 'Release'))
      displayName: 'Publish HarmonyCore.CliTool as Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)' 
        artifactName: 'HarmonyCore.CliTool'

    - task: DeleteFiles@1
      displayName: 'Clean ArtifactStagingDirectory'
      inputs:
        SourceFolder: '$(Build.ArtifactStagingDirectory)'
        Contents: '**/*'

    # publish test binaries (for both matrix legs, using RID from matrix)
    - ${{ each project in parameters.PublishProjects }}:
      - task: DotNetCoreCLI@2
        displayName: 'Publish ${{ project }} Binaries'
        inputs:
          command: publish
          publishWebProjects: false
          arguments: '-r=$(RID) -c $(Configuration) -o $(Build.ArtifactStagingDirectory)/${{ project }}'
          verbosityPack: Diagnostic
          zipAfterPublish: True
          projects: |
            ${{ project }}

    # for linux only build TraditionalBridge.Test in x86 (still runs on Windows agents)
    - task: MSBuild@1
      displayName: "Build 32 bit TraditionalBridge.Test.dbr"
      condition: and(eq(variables['Platform'], 'linux64'), eq(variables['Configuration'], 'Release'))
      inputs:
        solution: 'TraditionalBridge.Test'
        msbuildArchitecture: 'x64'
        platform: 'x86'
        configuration: 'Release'
      env: 
        TestDirX86: '\x86\'

    # for windows only copy TraditionalBridge.UnitTest/TBTest
    - task: CopyFiles@2
      condition: ne(variables['Platform'], 'linux64')
      displayName: "Copy TraditionalBridge.UnitTest/TBTest"
      inputs:
        SourceFolder: '$(SolutionDir)TraditionalBridge.UnitTest/TBTest'
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)/TraditionalBridge.UnitTest/TBTest'

    - task: CopyFiles@2
      displayName: "Copy TestDir"
      inputs:
        SourceFolder: '$(SolutionDir)TestDir'
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)/TestDir'

    - task: CopyFiles@2
      displayName: "Copy SampleData"
      inputs:
        SourceFolder: '$(SolutionDir)SampleData'
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)/SampleData'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Test Binaries as Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)' 
        artifactName: 'TestArtifacts$(Configuration)$(Platform)'

    - task: DeleteFiles@1
      displayName: 'Clean ArtifactStagingDirectory'
      inputs:
        SourceFolder: '$(Build.ArtifactStagingDirectory)'
        Contents: '**/*'
          
    - task: DotNetCoreCLI@2
      displayName: 'Pack CLI Tool'
      inputs:
        command: 'pack'
        # DotNetCoreCLI@2 with command=pack IGNORES the generic 'arguments' and 'projects'
        # inputs (it only reads packagesToPack/configuration/outputDir/nobuild/buildProperties).
        # With the old 'projects' input this step silently packed **/*.csproj (the
        # packagesToPack default) and dropped every flag we tried to pass.
        packagesToPack: 'HarmonyCore.CliTool/HarmonyCore.CliTool.csproj'
        configuration: '$(Configuration)'

    - task: NuGetCommand@2
      name: 'HarmonyCoreNuget'
      displayName: 'Pack HarmonyCore'
      inputs:
        command: 'pack'
        packagesToPack: '*.nuspec'
        versioningScheme: 'byBuildNumber'
    
    - task: NuGetCommand@2
      condition: and(eq(variables['Platform'], 'x64'), eq(variables['Configuration'], 'Release'))
      inputs:
        command: 'push'
        packagesToPush: '$(Build.ArtifactStagingDirectory)/Harmony.*.nupkg'
        nuGetFeedType: 'internal'
        publishVstsFeed: 'HarmonyCore'

    - publish: '$(Build.ArtifactStagingDirectory)/'
      displayName: 'Publish nuget packages'
      artifact: 'NugetPackages$(Configuration)$(Platform)'

  # Recreate the Linux build agent container on the Windows Podman host.
  - job: RemoveContainer
    dependsOn: BuildJob
    pool:
      name: $(BuildPool)
      demands:
        - agent.name -equals $(WinAgentName)
    steps:
    - checkout: none

    - task: PowerShell@2
      displayName: "Remove old hcimage container/image"
      inputs:
        targetType: inline
        script: |
          $containers = podman ps -a -q --filter ancestor=hcimage
          if ($containers) {
            $containers | ForEach-Object { podman stop $_ }
            $containers | ForEach-Object { podman rm $_ }
          }

          $images = podman images -a -q --filter "reference=hcimage"
          if ($images) {
            podman image rm hcimage
          }

          podman image prune -f | Out-Null
          podman images
          podman ps -a

  - job: CreateContainer
    dependsOn: RemoveContainer
    condition: succeeded('RemoveContainer')
    variables:
    - group: "PAT for agent pool"
    pool:
      name: $(BuildPool)
      demands:
        - agent.name -equals $(WinAgentName)
    steps:
    - checkout: self
      sparseCheckoutDirectories: 'buildDefinitions'
      clean: true
      path: podman

    - task: DownloadSecureFile@1
      name: autoInstall
      displayName: "Get install support files"
      inputs:
        secureFile: 'linux.auto.install'

    - task: PowerShell@2
      displayName: "Stage build context"
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        SDE_ARTIFACTS_TOKEN: $(SdeArtifactsToken)
      inputs:
        targetType: inline
        script: |
          Copy-Item "$(autoInstall.secureFilePath)" linux.auto.install -Force

          $token = $env:SDE_ARTIFACTS_TOKEN
          if (-not $token -or $token.StartsWith('$(')) {
            $token = $env:SYSTEM_ACCESSTOKEN
          }
          $headers = @{ Authorization = "Bearer $token" }
          Invoke-WebRequest -Uri "$(SdeArchiveUrl)" -Headers $headers -OutFile sde-archive.a
          $size = (Get-Item sde-archive.a).Length
          Write-Host "Downloaded archive ($size bytes)"
          if ($size -lt 10MB) {
            Write-Error "Download suspiciously small."
            exit 1
          }
        workingDirectory: $(Agent.BuildDirectory)/podman/buildDefinitions

    - task: PowerShell@2
      displayName: "Build hcimage"
      inputs:
        targetType: inline
        script: |
          # change line endings for Dockerfile and shell scripts
          (Get-Content -Raw Dockerfile) -replace "`r" | Set-Content -NoNewline -Encoding utf8 Dockerfile
          (Get-Content -Raw startagent.sh) -replace "`r" | Set-Content -NoNewline -Encoding utf8 startagent.sh
          (Get-Content -Raw linux.auto.install) -replace "`r" | Set-Content -NoNewline -Encoding utf8 linux.auto.install
          podman build --progress=plain --build-arg LICENSE_SERVER="$(SdeLicenseServer)" -t hcimage .
        workingDirectory: $(Agent.BuildDirectory)/podman/buildDefinitions

    - task: PowerShell@2
      displayName: "Create hccontainer"
      inputs:
        targetType: inline
        script: |
          podman run -dit `
            -e AZP_URL="$(System.CollectionUri)" `
            -e AZP_TOKEN="$(PAT_AGENT_POOL)" `
            -e AZP_POOL="$(BuildPool)" `
            -e AZP_AGENT_NAME="$(LinuxAgentName)" `
            --name "hccontainer" hcimage

          $containerStatus = podman inspect --format='{{.State.Status}}' hccontainer
          if ($containerStatus -eq "running") {
            Write-Host "Container is running."
          } else {
            Write-Error "Container is not running. Current status: $containerStatus."
            exit 1
          }
        workingDirectory: $(Agent.BuildDirectory)/podman/buildDefinitions

    - task: PowerShell@2
      displayName: "Wait for agent initialization"
      inputs:
        targetType: inline
        script: |
          Start-Sleep -Seconds 60

  # Test jobs consume the agent names from the pipeline UI variables the same way BuildJob
  # does: a direct $(WinAgentName)/$(LinuxAgentName) in the pool demand. That direct reference
  # only works job-wide (demands are expanded once, server-side), and the two test legs target
  # DIFFERENT agents — so they are two jobs rather than one matrixed job. The steps live once
  # in buildDefinitions/test-steps.yml.
  - job: TestJobWin
    displayName: 'TestJob x64'
    dependsOn:
    - BuildJob
    - CreateContainer
    workspace:
      clean: all
    pool:
      name: $(BuildPool)
      demands:
        - agent.name -equals $(WinAgentName)
    variables:
      Configuration: Release
      Platform: x64
    steps:
    - template: buildDefinitions/test-steps.yml
      parameters:
        PublishProjects: ${{ parameters.PublishProjects }}
        Platform: x64

  - job: TestJobLinux
    displayName: 'TestJob linux64'
    dependsOn:
    - BuildJob
    - CreateContainer
    workspace:
      clean: all
    pool:
      name: $(BuildPool)
      demands:
        - agent.name -equals $(LinuxAgentName)
    variables:
      Configuration: Release
      Platform: linux64
    steps:
    - template: buildDefinitions/test-steps.yml
      parameters:
        PublishProjects: ${{ parameters.PublishProjects }}
        Platform: linux64

  # ---------------------------------------------------------------------------------------------
  # Linux smoke test: a Harmony Core application built with THIS run's packages, deployed on the
  # Linux agent container with the harmonydemo template's own scripts (Linux/startserver.sh,
  # stopserver.sh, check.sh, TraditionalBridge/launch.sh) and exercised over HTTPS, including a
  # Traditional Bridge round trip. Nothing else in this pipeline covers that path: the sample jobs
  # use the harmonycore template (no Linux scripts) on the Windows agent, and TestJobLinux only
  # runs prebuilt test assemblies. Same split as the rest of the pipeline: build on the Windows
  # agent (cross-RID publish, as publish.bat LINUX does), run in the Linux agent container.
  - job: LinuxSmokeTestPublish
    displayName: 'Linux smoke test: publish harmonydemo with this build'
    dependsOn: BuildJob
    workspace:
      clean: all
    pool:
      name: $(BuildPool)
      demands:
        - agent.name -equals $(WinAgentName)
    variables:
      DemoDir: $(Pipeline.Workspace)\hcdemo
      # Common.props derives RPSMFIL/RPSTFIL/EXE/DAT from $(SolutionDir). msbuild sets it for the
      # .sln build; the project-level dotnet publish below picks it up from this variable.
      SolutionDir: $(Pipeline.Workspace)\hcdemo\
      LocalFeed: $(Pipeline.Workspace)\NugetPackagesReleasex64
      DeployDir: $(Build.ArtifactStagingDirectory)\hcdemo-linux
    steps:
    - checkout: HarmonyCoreProjectTemplates
      clean: true
      path: HarmonyCoreProjectTemplates

    - task: UseDotNet@2
      displayName: 'Get .NET SDK 10.0.x'
      inputs:
        packageType: 'sdk'
        version: '10.0.x'

    - task: NuGetToolInstaller@1
      displayName: 'Get NuGet 7.x'
      inputs:
        versionSpec: 7.x
        checkLatest: true

    - task: CmdLine@2
      displayName: "Install Harmony Core templates"
      inputs:
        script: |
          dotnet new uninstall Harmony.Core.ProjectTemplates
          call GenerateLocalPackages.bat
          call InstallLocalPackages.bat
        workingDirectory: '$(Pipeline.Workspace)\HarmonyCoreProjectTemplates'

    - task: CmdLine@2
      displayName: "Create harmonydemo solution"
      inputs:
        script: |
          dotnet new harmonydemo -o hcdemo
        workingDirectory: '$(Pipeline.Workspace)'

    # The template pins the released Harmony.Core* versions. The smoke test must run THIS build's
    # packages, so: restore from this run's package artifact (same nuget.config as the sample job)
    # and retarget the pins to the build number (Pack HarmonyCore uses versioningScheme byBuildNumber).
    - task: DownloadPipelineArtifact@2
      displayName: "Download this build's NuGet packages"
      inputs:
        buildType: 'current'
        artifact: 'NugetPackagesReleasex64'
        targetPath: '$(LocalFeed)'

    - task: PowerShell@2
      displayName: "Point harmonydemo at this build's Harmony.Core packages"
      inputs:
        targetType: inline
        workingDirectory: '$(DemoDir)'
        script: |
          $ErrorActionPreference = 'Stop'
          $localFeed = "$(LocalFeed)"
          $version = "$(Build.BuildNumber)"

          # <clear /> drops machine/user-level sources inherited on the agent, so the generated
          # solution restores deterministically from this run's packages plus nuget.org.
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$localFeed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          "@ | Out-File -FilePath 'nuget.config' -Encoding utf8

          $ids = 'Harmony.Core', 'Harmony.Core.EF', 'Harmony.Core.OData', 'Harmony.Core.AspNetCore'
          foreach ($id in $ids) {
            if (-not (Test-Path "$localFeed\$id.$version.nupkg")) { throw "$id.$version.nupkg is not in the NugetPackagesReleasex64 artifact" }
          }
          $pattern = '(?s)(<PackageReference\s+Include="(' + (($ids | ForEach-Object { [regex]::Escape($_) }) -join '|') + ')"\s*>\s*<Version>)[^<]+(</Version>)'
          $changed = 0
          Get-ChildItem -Recurse -Filter *.synproj | ForEach-Object {
            $text = Get-Content -Raw $_.FullName
            $new = [regex]::Replace($text, $pattern, ('${1}' + $version + '${3}'))
            if ($new -ne $text) { [IO.File]::WriteAllText($_.FullName, $new); $changed++; Write-Host "retargeted $($_.FullName)" }
          }
          if ($changed -eq 0) { throw 'no Harmony.Core* PackageReference was retargeted' }
          Write-Host "Harmony.Core* references now pinned to $version in $changed project(s)"

    - task: MSBuild@1
      displayName: "Restore harmonydemo"
      inputs:
        solution: '$(DemoDir)\*.sln'
        msbuildArchitecture: 'x64'
        configuration: 'Release'
        msbuildArguments: '-t:restore'
        clean: false

    # Release|Any CPU builds TraditionalBridge as Release|x86 into TraditionalBridge\EXE. The .dbr
    # is portable; TestJobLinux already runs an x86-built .dbr the same way.
    - task: VSBuild@1
      displayName: "Build harmonydemo"
      inputs:
        solution: '$(DemoDir)\*.sln'
        configuration: 'Release'

    - task: CmdLine@2
      displayName: "Publish Services.Host for linux-x64"
      inputs:
        script: |
          dotnet publish Services.Host\Services.Host.synproj -c Release -r linux-x64 --self-contained true -p:platform=AnyCPU -p:PublishTrimmed=false -o "$(DeployDir)" -nologo -v minimal
        workingDirectory: '$(DemoDir)'

    - task: PowerShell@2
      displayName: "Assemble Linux deployment (what publish.bat LINUX ships)"
      inputs:
        targetType: inline
        workingDirectory: '$(DemoDir)'
        script: |
          $ErrorActionPreference = 'Stop'
          $deploy = "$(DeployDir)"
          foreach ($f in 'TraditionalBridge\EXE\host.dbr', 'TraditionalBridge\launch.sh') {
            if (-not (Test-Path $f)) { throw "missing $f" }
            Copy-Item $f $deploy -Force
          }
          if (Test-Path 'TraditionalBridge\EXE\host.dbp') { Copy-Item 'TraditionalBridge\EXE\host.dbp' $deploy -Force }
          Copy-Item 'Linux\*.sh' $deploy -Force
          Copy-Item 'Linux\startserver.*.config' $deploy -Force
          New-Item -ItemType Directory -Force "$deploy\SampleData" | Out-Null
          Copy-Item 'SampleData\*.txt', 'SampleData\*.xdl' "$deploy\SampleData" -Force
          Copy-Item 'SampleData\sysparams.txt' "$deploy\SampleData\sysparams.ddf" -Force
          dotnet dev-certs https --export-path "$deploy\Services.Host.pfx" --password p@ssw0rd --quiet
          if (-not (Test-Path "$deploy\Services.Host.pfx")) { throw 'dev-certs export failed' }
          if (-not (Test-Path "$deploy\Services.Host")) { throw 'Services.Host (linux-x64 apphost) missing from publish output' }
          Get-ChildItem $deploy | Select-Object Name, Length | Format-Table -AutoSize

    - task: PublishPipelineArtifact@1
      displayName: 'Publish HarmonyDemoLinux'
      inputs:
        targetPath: '$(DeployDir)'
        artifactName: 'HarmonyDemoLinux'

  - job: LinuxSmokeTest
    displayName: 'Linux smoke test: deploy and exercise harmonydemo'
    dependsOn:
    - LinuxSmokeTestPublish
    - CreateContainer
    workspace:
      clean: all
    pool:
      name: $(BuildPool)
      demands:
        - agent.name -equals $(LinuxAgentName)
    steps:
    - checkout: none

    - download: current
      displayName: "Download HarmonyDemoLinux"
      artifact: HarmonyDemoLinux

    - task: Bash@3
      displayName: 'startserver.sh -> endpoints -> bridge -> check.sh -> stopserver.sh'
      inputs:
        targetType: inline
        workingDirectory: $(Pipeline.Workspace)/HarmonyDemoLinux
        script: |
          set -u
          . "$(Agent.HomeDirectory)/setsde"    # Synergy runtime environment (SDE, DBLDIR), as TestJobLinux does

          # The artifact was assembled on Windows: give it the line endings and exec bits that
          # publish.bat LINUX gives a real deployment.
          if command -v dos2unix > /dev/null; then dos2unix -q *.sh *.config; else sed -i 's/\r$//' *.sh *.config; fi
          chmod +x *.sh Services.Host

          SERVER=Services.Host.LinuxDemo
          fail() {
            echo "##vso[task.logissue type=error]$1"
            echo "--- server log ---"; tail -n 200 $SERVER-*.log 2> /dev/null
            pkill -f "$SERVER" 2> /dev/null; pkill -f 'host\.dbr' 2> /dev/null
            exit 1
          }

          echo "== 0. the deployment must contain this build's Harmony.Core ($(Build.BuildNumber)) =="
          grep -q "\"Harmony.Core/$(Build.BuildNumber)\"" Services.Host.deps.json || fail "Services.Host.deps.json does not reference Harmony.Core $(Build.BuildNumber)"

          echo "== 1. every script must parse =="
          for f in *.sh; do bash -n "$f" || fail "$f does not parse"; done

          echo "== 2. no .environment: startserver.sh must refuse to start =="
          rm -f .environment environment
          out=$(./startserver.sh detach 2>&1); echo "$out"
          echo "$out" | grep -q "hidden file '.environment'" || fail "startserver.sh did not ask for the hidden file .environment"
          pidof $SERVER > /dev/null && fail "the service started without an environment file"

          echo "== 3. .environment = LinuxDemo: startserver.sh detach =="
          echo LinuxDemo > .environment
          ./startserver.sh detach || true      # the scripts exit 2 even on success (return/exit idiom)
          sleep 3
          pidof $SERVER > /dev/null || fail "$SERVER is not running after startserver.sh"

          echo "== 4. wait for Kestrel on https://localhost:8086 =="
          code=000
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' 'https://localhost:8086/$metadata' || true)
            [ "$code" = "200" ] && break
            pidof $SERVER > /dev/null || fail "$SERVER exited during startup"
            sleep 2
          done
          [ "$code" = "200" ] || fail "GET /\$metadata returned $code after 120s"

          echo "== 5. OData entity set =="
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8086/Customers || true)
          [ "$code" = "200" ] || fail "GET /Customers returned $code"

          echo "== 6. Traditional Bridge round trip (Services.Host -> launch.sh -> dbs host.dbr) =="
          code=$(curl -sk -o bridge.json -w '%{http_code}' -H 'Content-Type: application/json' https://localhost:8086/BridgeAPI/GetEnvironment || true)
          cat bridge.json 2> /dev/null; echo
          [ "$code" = "200" ] || fail "GET /BridgeAPI/GetEnvironment returned $code"

          echo "== 7. check.sh =="
          ./check.sh
          ./check.sh | grep -q "($SERVER): [0-9]" || fail "check.sh does not report the running service"

          echo "== 8. stopserver.sh =="
          ./stopserver.sh || true
          sleep 2
          pidof $SERVER > /dev/null && fail "$SERVER is still running after stopserver.sh"
          echo "Linux smoke test OK: Harmony.Core $(Build.BuildNumber) deployed, started, queried, bridged and stopped"

    - task: Bash@3
      displayName: 'Cleanup leftover processes'
      condition: always()
      inputs:
        targetType: inline
        script: |
          pkill -f 'Services.Host.LinuxDemo' 2> /dev/null || true
          pkill -f 'host\.dbr' 2> /dev/null || true

  - job: BuildHarmonyCoreProjects
    dependsOn: BuildJob
    workspace:
      clean: all
    pool:
      name: $(BuildPool)
      demands:
        - agent.name -equals $(WinAgentName)
    strategy:
      maxParallel: 4
      matrix:
        Basic: 
          project: basic
        Tb:
          project: tb
        TbStruct:
          project: tbstruct
    variables:
    - name: clitool
      value: $(Pipeline.Workspace)\HarmonyCore.CliTool\Harmony.Core.CliTool.exe
    - name: SolutionDir
      value: $(Pipeline.Workspace)\$(project)\
    steps:
    - checkout: HarmonyCoreSamples
      clean: true
      path: HarmonyCoreSamples
      
    - checkout: HarmonyCoreProjectTemplates
      clean: true
      path: HarmonyCoreProjectTemplates

    - task: CopyFiles@2
      condition: ne(variables.project, 'basic')
      inputs:
        SourceFolder: '$(Pipeline.Workspace)\HarmonyCoreSamples\$(project)'
        Contents: '**'
        TargetFolder: '$(Pipeline.Workspace)\$(project)'

    - task: CopyFiles@2
      displayName: 'Copy powershell scripts'
      inputs:
        SourceFolder: '$(Pipeline.Workspace)\HarmonyCoreSamples\CICD'
        Contents: '**'
        TargetFolder: '$(Pipeline.Workspace)\CICD'

    - task: UseDotNet@2
      displayName: 'Get .NET SDK 10.0.x'
      inputs:
        packageType: 'sdk'
        version: '10.0.x'

    - task: NuGetToolInstaller@1
      displayName: 'Get NuGet 7.x'
      inputs:
        versionSpec: 7.x
        checkLatest: true

    - task: CmdLine@2
      displayName: "Install Harmony Core templates"
      inputs:
        script: |
          dotnet new uninstall Harmony.Core.ProjectTemplates
          call GenerateLocalPackages.bat
          call InstallLocalPackages.bat
        workingDirectory: '$(Pipeline.Workspace)\HarmonyCoreProjectTemplates'

    - task: CmdLine@2
      displayName: "Create new project from a template"
      inputs:
        script: |
          dotnet new harmonycore -o $(project)
        workingDirectory: '$(Pipeline.Workspace)'

    # download clitools
    - download: current
      displayName: "Download Artifacts"
      artifact: 'HarmonyCore.CliTool'

    - task: ExtractFiles@1
      displayName: "Extract HarmonyCore.CliTool"
      inputs:
        archiveFilePatterns: '$(Pipeline.Workspace)/HarmonyCore.CliTool/*.zip'
        destinationFolder: '$(Pipeline.Workspace)/HarmonyCore.CliTool'
        cleanDestinationFolder: false
        overwriteExistingFiles: false

    - download: current
      displayName: "Download HCarchive"
      artifact: 'HCarchive'

    - task: DownloadPipelineArtifact@2
      displayName: "Download cli-tool-versions"
      inputs:
        buildType: 'current'
        artifact: 'cli-tool-versions'
        targetPath: '$(Pipeline.Workspace)\$(project)'

    - task: CmdLine@2
      displayName: "Create dir for nuget packages"
      inputs:
        script: |
          mkdir NugetPackagesReleasex64
        workingDirectory: '$(Pipeline.Workspace)'

    # download nuget packages
    - task: DownloadPipelineArtifact@2
      displayName: "Download nugetpackages"
      inputs:
        buildType: 'current'
        artifact: 'NugetPackagesReleasex64'
        targetPath: '$(Pipeline.Workspace)\NugetPackagesReleasex64'

    - task: PowerShell@2
      displayName: "Create nuget.config" 
      inputs:
        targetType: 'inline'
        script: |
          $nugetConfigPath = "$(Pipeline.Workspace)\$(project)\nuget.config"
          $localFeedPath = "$(Pipeline.Workspace)\NugetPackagesReleasex64"

          # Create the nuget.config content. <clear /> drops machine/user-level sources
          # inherited on the agent (e.g. stale local feeds registered by other pipelines),
          # so the generated project restores deterministically from just these two.
          $nugetConfigContent = @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$localFeedPath" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          "@

          # Write the content to the nuget.config file
          $nugetConfigContent | Out-File -FilePath $nugetConfigPath -Encoding utf8
        workingDirectory: '$(Pipeline.Workspace)\$(project)'

    - task: CmdLine@2
      displayName: "Run harmonycore upgrade-latest"
      inputs:
        script: |
          echo YES| ${{ variables.clitool }} upgrade-latest -z $(Pipeline.Workspace)\HCarchive\net10-release.zip
        workingDirectory: '$(Pipeline.Workspace)\$(project)'
      
    - task: CmdLine@2
      displayName: "Add Structures"
      inputs:
        script: |
          ${{ variables.clitool }} codegen-add --structure --odata --ef -i CUSTOMERS ITEMS ORDERS ORDER_ITEMS VENDORS
          ${{ variables.clitool }} regen -p
        workingDirectory: '$(Pipeline.Workspace)\$(project)'

    - task: PowerShell@2
      condition: ne(variables.project, 'basic')
      displayName: "Add PK generator and StartupCustom to Services.synproj" 
      inputs:
        filePath: '$(Pipeline.Workspace)\CICD\automationscripts.ps1'
        arguments: 'AddServices $(Pipeline.Workspace)\$(project)\Services\Services.synproj'
        failOnStderr: true
        workingDirectory: '$(Pipeline.Workspace)\$(project)\Services'

    - task: CmdLine@2
      condition: ne(variables.project, 'basic')
      displayName: "Add Traditional Bridge"
      inputs:
        script: |
          ${{ variables.clitool }} features --add-tb
        workingDirectory: '$(Pipeline.Workspace)\$(project)'

    - task: PowerShell@2
      condition: ne(variables.project, 'basic')
      displayName: "Update host.dbl" 
      inputs:
        filePath: '$(Pipeline.Workspace)\CICD\automationscripts.ps1'
        arguments: 'UpdateHost $(Pipeline.Workspace)\$(project)\TraditionalBridge\Source\host.dbl'
        failOnStderr: true
        workingDirectory: '$(Pipeline.Workspace)\$(project)\TraditionalBridge\Source'

    - task: PowerShell@2
      condition: ne(variables.project, 'basic')
      displayName: "Update platform for TB" 
      inputs:
        filePath: '$(Pipeline.Workspace)\CICD\automationscripts.ps1'
        arguments: 'UpdateTbPlatform $(Pipeline.Workspace)\$(project)\$(project).sln'
        failOnStderr: true
        workingDirectory: '$(Pipeline.Workspace)\$(project)'

    - task: PowerShell@2
      condition: ne(variables.project, 'basic')
      displayName: "Update output path for TB" 
      inputs:
        filePath: '$(Pipeline.Workspace)\CICD\automationscripts.ps1'
        arguments: 'UpdateTbOutput $(Pipeline.Workspace)\$(project)\TraditionalBridge\TraditionalBridge.synproj'
        failOnStderr: true
        workingDirectory: '$(Pipeline.Workspace)\$(project)\TraditionalBridge'

    - task: CmdLine@2
      condition: ne(variables.project, 'basic')
      displayName: "Enable SMC import and run upgrade-latest"
      inputs:
        script: |
          %clitool% features --smc $(Pipeline.Workspace)\$(project)\TraditionalBridge\MethodCatalog\MethodDefinitions.xml
          echo run upgrade-latest
          echo YES| %clitool% upgrade-latest -z $(Pipeline.Workspace)\HCarchive\net10-release.zip
        workingDirectory: '$(Pipeline.Workspace)\$(project)'

    - task: PowerShell@2
      condition: eq(variables.project, 'tb')
      displayName: "Add methods to TraditionalBridge.synproj Tb" 
      inputs:
        filePath: '$(Pipeline.Workspace)\CICD\automationscripts.ps1'
        arguments: 'AddMethodsTb $(Pipeline.Workspace)\$(project)\TraditionalBridge\TraditionalBridge.synproj'
        failOnStderr: true
        workingDirectory: '$(Pipeline.Workspace)\$(project)\TraditionalBridge'

    - task: PowerShell@2
      condition: eq(variables.project, 'tbstruct')
      displayName: "Add methods to TraditionalBridge.synproj TbStruct"
      inputs:
        filePath: '$(Pipeline.Workspace)\CICD\automationscripts.ps1'
        arguments: 'AddMethodsTbStruct $(Pipeline.Workspace)\$(project)\TraditionalBridge\TraditionalBridge.synproj'
        failOnStderr: true
        workingDirectory: '$(Pipeline.Workspace)\$(project)\TraditionalBridge'
    
    - task: CmdLine@2
      condition: eq(variables.project, 'tbstruct')
      displayName: "Add TraditionalBridgeGenerator to CUSTOMERS structure"
      inputs:
        script: |
          %clitool% codegen-add --structure --tb -i CUSTOMERS
        workingDirectory: '$(Pipeline.Workspace)\$(project)'

    - task: CmdLine@2
      condition: ne(variables.project, 'basic')
      displayName: "Add BridgeMethods interface"
      inputs:
        script: |
          %clitool% codegen-add --interface --webapi -i BridgeMethods
        workingDirectory: '$(Pipeline.Workspace)\$(project)'

    - task: PowerShell@2
      condition: ne(variables.project, 'basic')
      displayName: "Set ODATA CreateTestFiles option"
      inputs:
        filePath: '$(Pipeline.Workspace)\CICD\automationscripts.ps1'
        arguments: 'SetCreateTestFiles $(Pipeline.Workspace)\$(project)\Harmony.Core.CodeGen.json'
        failOnStderr: true
        workingDirectory: '$(Pipeline.Workspace)\$(project)'

    - task: PowerShell@2
      condition: eq(variables.project, 'basic')
      displayName: "Set ODATA Options"
      inputs:
        filePath: '$(Pipeline.Workspace)\CICD\automationscripts.ps1'
        arguments: 'SetOdataBasic $(Pipeline.Workspace)\$(project)\Harmony.Core.CodeGen.json'
        failOnStderr: true
        workingDirectory: '$(Pipeline.Workspace)\$(project)'
   
    - task: CmdLine@2
      condition: eq(variables.project, 'basic')
      displayName: "Add unit tests"
      inputs:
        script: |
          echo YES| %clitool% features --add-unit-tests -z $(Pipeline.Workspace)\HCarchive\net10-release.zip
        workingDirectory: '$(Pipeline.Workspace)\$(project)'
      env: 
        LOCAL_HC_TEMPLATES: 1

    - task: CmdLine@2
      displayName: "Run regen -p and upgrade-latest"
      inputs:
        script: |
          %clitool% regen -p
          echo YES| %clitool% upgrade-latest -z $(Pipeline.Workspace)\HCarchive\net10-release.zip
        workingDirectory: '$(Pipeline.Workspace)\$(project)'

    - task: DotNetCoreCLI@2
      condition: eq(variables.project, 'basic')
      displayName: "Build the project Basic"
      inputs:
        command: 'build'
        projects: '$(Pipeline.Workspace)\$(project)'
        arguments: '--configuration Release'

    - task: DotNetCoreCLI@2
      condition: eq(variables.project, 'basic')
      displayName: "Run Services.Test"
      inputs:
        command: 'test'
        projects: '$(Pipeline.Workspace)\$(project)\Services.Test'
        testRunTitle: "Services.Test Basic Solution"
        workingDirectory: '$(Pipeline.Workspace)\$(project)'

    # VSBuild's restoreNugetPackages is deprecated: it runs the agent-bundled (ancient)
    # NuGet.exe, which can't load MSBuild 18's assemblies ("Could not load Microsoft.Build
    # .Framework, Version=15.1.0.0"). Restore the same way the main BuildJob does instead.
    - task: MSBuild@1
      condition: ne(variables.project, 'basic')
      displayName: "Restore the project Tb"
      inputs:
        solution: '$(Pipeline.Workspace)\$(project)\$(project).sln'
        msbuildArchitecture: 'x64'
        configuration: 'Release'
        msbuildArguments: '-t:restore'
        clean: false

    - task: VSBuild@1
      condition: ne(variables.project, 'basic')
      displayName: "Build the project Tb"
      inputs:
        solution: '$(Pipeline.Workspace)\$(project)\$(project).sln'
        configuration: 'Release'

    - task: PowerShell@2
      condition: eq(variables.project, 'tb')
      displayName: "Run the host and test the endpoint Tb"
      inputs:
        filePath: '$(Pipeline.Workspace)\CICD\automationscripts.ps1'
        arguments: 'TestTb $(Pipeline.Workspace)\$(project)\'
        failOnStderr: true
        workingDirectory: '$(Pipeline.Workspace)\$(project)\Services.Host'

    - task: PowerShell@2
      condition: eq(variables.project, 'tbstruct')
      displayName: "Run the host and test endpoints TbStruct"
      inputs:
        filePath: '$(Pipeline.Workspace)\CICD\automationscripts.ps1'
        arguments: 'TestTbStruct $(Pipeline.Workspace)\$(project)\'
        failOnStderr: true
        workingDirectory: '$(Pipeline.Workspace)\$(project)\Services.Host'

    - task: PowerShell@2
      condition: ne(variables.project, 'basic')
      displayName: "Update JSON to enable Authentication"
      inputs:
        filePath: '$(Pipeline.Workspace)\CICD\automationscripts.ps1'
        arguments: 'EnableAuth $(Pipeline.Workspace)\$(project)\Harmony.Core.CodeGen.json'
        failOnStderr: true
        workingDirectory: '$(Pipeline.Workspace)\$(project)'

    - task: CmdLine@2
      condition: ne(variables.project, 'basic')
      displayName: "Run regen -p"
      inputs:
        script: |
          %clitool% regen -p
        workingDirectory: '$(Pipeline.Workspace)\$(project)'

    # regen can touch project files; re-restore with MSBuild before the rebuild
    # (VSBuild restoreNugetPackages stays off — see the note on the first build).
    - task: MSBuild@1
      condition: ne(variables.project, 'basic')
      displayName: "Restore the project Tb (post-regen)"
      inputs:
        solution: '$(Pipeline.Workspace)\$(project)\$(project).sln'
        msbuildArchitecture: 'x64'
        configuration: 'Release'
        msbuildArguments: '-t:restore'
        clean: false

    - task: VSBuild@1
      condition: ne(variables.project, 'basic')
      displayName: "Build the project Tb"
      inputs:
        solution: '$(Pipeline.Workspace)\$(project)\$(project).sln'
        configuration: 'Release'

    - task: PowerShell@2
      condition: eq(variables.project, 'tb')
      displayName: "Run the host and test the endpoint AUTH Tb"
      inputs:
        filePath: '$(Pipeline.Workspace)\CICD\automationscripts.ps1'
        arguments: 'TestTbAuth $(Pipeline.Workspace)\$(project)\'
        failOnStderr: true
        workingDirectory: '$(Pipeline.Workspace)\$(project)\Services.Host'

    - task: PowerShell@2
      condition: eq(variables.project, 'tbstruct')
      displayName: "Run the host and test endpoints with AUTH TbStruct"
      inputs:
        filePath: '$(Pipeline.Workspace)\CICD\automationscripts.ps1'
        arguments: 'TestTbStructAuth $(Pipeline.Workspace)\$(project)\'
        failOnStderr: true
        workingDirectory: '$(Pipeline.Workspace)\$(project)\Services.Host'
